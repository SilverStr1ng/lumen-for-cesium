<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lumen for Cesium · Sponza</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../cesium-1.146/Build/CesiumUnminified/Widgets/widgets.css">
  <style>
    *{box-sizing:border-box}html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px/1.5 system-ui,sans-serif;background:#151719;color:#e9e8e4}
    aside{position:absolute;top:18px;left:18px;width:286px;padding:20px;max-height:calc(100vh - 65px);overflow:auto;background:#1b2026ed;border:1px solid #41464d;border-radius:6px;box-shadow:0 8px 30px #0005}h1{font-size:19px;margin:0 0 4px;font-weight:600}.tag{font-size:11px;letter-spacing:.08em;color:#d1ad72}p{color:#aeb7c1;font-size:12px;margin:12px 0 18px}label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0}select{background:#2b323b;color:inherit;border:1px solid #4e5965;padding:5px;max-width:168px}input[type=range]{width:125px;accent-color:#d1ad72}input[type=checkbox]{accent-color:#d1ad72}button{background:#303944;color:inherit;border:1px solid #4e5965;padding:7px 10px;cursor:pointer}button:hover{border-color:#d1ad72}.buttons{display:flex;gap:8px;margin-top:18px}#status{font-size:11px;white-space:pre-line;color:#aeb7c1;border-top:1px solid #41464d;margin-top:18px;padding-top:12px}#error{color:#ffa68e;white-space:pre-wrap}footer{position:absolute;bottom:38px;right:18px;color:#babdc3;font-size:12px;text-shadow:0 1px 3px #000}
  </style>
</head>
<body>
  <a href="globe.html" style="position:absolute;right:20px;top:20px;z-index:5;color:white;background:#17334b;padding:12px">Earth GI Lab · 本地地球展馆</a>
  <div id="view"></div>
  <aside>
    <div class="tag">STAGE C / GPU WORLD SPACE GI</div>
    <h1>Lumen for Cesium</h1>
    <p>Sponza · WebGL2 分批 BVH 求交、表面出射光缓存与 DDGI 更新。灯光变化自动重算，更新期间保留完整光照；转动镜头保留屏幕外反弹。</p>
    <label>世界间接光<input id="enabled" type="checkbox" checked></label>
    <label>太阳阴影<input id="shadows" type="checkbox" checked></label>
    <label>GI 增益 <output id="energyValue">0.50</output><input id="energy" type="range" min="0" max="3" step="0.05" value="0.5"></label>
    <label>反弹次数<select id="bounces"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
    <label>发布方式<select id="publication"><option value="snapshot">完整快照</option><option value="progressive">逐轮预览</option></select></label>
    <label>天空能量<input id="sky" type="range" min="0" max="3" step="0.1" value="1"></label>
    <label title="只对 GI 缓存去色，显示材质保持原样，用于检验幕布向地面的颜色传输">GI 红幕布去色<input id="neutral" type="checkbox"></label>
    <label>替换漫射 IBL<input id="coverage" type="range" min="0" max="1" step="0.05" value="1"></label>
    <label>曝光<input id="exposure" type="range" min="0.2" max="3" step="0.1" value="1"></label>
    <label>太阳方位<input id="sun" type="range" min="0" max="360" step="5" value="40"></label>
    <label>视图<select id="mode">
      <option value="final">最终光照</option><option value="direct">直接光</option><option value="indirect">间接漫射光</option><option value="emission">自发光</option><option value="albedo">反照率</option><option value="normal">材质法线</option><option value="roughness">粗糙度</option><option value="depth">线性深度</option><option value="validity">材质有效性</option>
    </select></label>
    <label>捕获 GBuffer<input id="capture" type="checkbox" checked></label>
    <div class="buttons"><button id="outside">整体视角</button><button id="inside">庭院视角</button><button id="reset">重置</button></div>
    <div id="status">加载 Sponza…</div><div id="error"></div>
  </aside>
  <footer>左键旋转 · 中键平移 · 滚轮缩放</footer>
  <script>window.CESIUM_BASE_URL="/cesium-1.146/Build/CesiumUnminified/";</script>
  <script src="../cesium-1.146/Build/CesiumUnminified/Cesium.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
